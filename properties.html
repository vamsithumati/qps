    <div class="section properties">

        <ul class="properties-filter" id="properties-filter"></ul>
        <div class="row properties-box" id="properties-container"></div>
      </div>
    </div>
    <script>
      const properties = [
        {
          id: 1,
          img: "assets/images/property-01.jpg",
          category: "POOLS & SPAS",
          price: "$2.264.000",
          address: "18 Old Street Miami, OR 97219",
          link: "property-details.html",
          tags: ["Luxury", "Modern"],
        },
        {
          id: 2,
          img: "assets/images/property-02.jpg",
          category: "LANDSCAPE",
          price: "$1.180.000",
          address: "54 New Street Florida, OR 27001",
          link: "property-details.html",
          tags: ["Eco-Friendly", "Spacious"],
        },
        {
          id: 3,
          img: "assets/images/property-03.jpg",
          category: "OUTDOOR KITCHENS",
          price: "$1.460.000",
          address: "26 Mid Street Portland, OR 38540",
          link: "property-details.html",
          tags: ["Modern", "Family"],
        },
        {
          id: 4,
          img: "assets/images/property-04.jpg",
          category: "WATERFALL",
          price: "$584.500",
          address: "12 Hope Street Portland, OR 12650",
          link: "property-details.html",
          tags: ["Luxury", "Nature"],
        },
        {
          id: 5,
          img: "assets/images/property-05.jpg",
          category: "LIGHTING",
          price: "$925.600",
          address: "34 Hope Street Portland, OR 42680",
          link: "property-details.html",
          tags: ["Modern", "Elegant"],
        },
        {
          id: 6,
          img: "assets/images/property-06.jpg",
          category: "GAZEBO",
          price: "$450.000",
          address: "22 Hope Street Portland, OR 16540",
          link: "property-details.html",
          tags: ["Cozy", "Nature"],
        },
      ];

      const categories = [
        ...new Set(properties.map((property) => property.category)),
      ].map((category, index) => ({ id: index + 1, name: category }));
      const tags = [
        ...new Set(properties.flatMap((property) => property.tags)),
      ];
      const propertiesFilter = document.getElementById("properties-filter");

      propertiesFilter.innerHTML = `<li><a class="is_active" href="#!" data-filter="*">Show All</a></li>`;
      categories.forEach((category) => {
        propertiesFilter.innerHTML += `<li><a href="#!" data-filter=".category-${category.id}">${category.name}</a></li>`;
      });
      tags.forEach((tag) => {
        propertiesFilter.innerHTML += `<li><a href="#!" data-filter=".${tag
          .replace(/\s+/g, "-")
          .toLowerCase()}">${tag}</a></li>`;
      });

      const propertiesContainer = document.getElementById(
        "properties-container"
      );

      function renderProperties() {
        propertiesContainer.innerHTML = "";

        properties.forEach((property) => {
          const category = categories.find(
        (cat) => cat.name === property.category
          );
          const propertyItem = document.createElement("div");
          propertyItem.className = `col-lg-4 col-md-6 align-self-center mb-30 properties-items category-${category.id} ${property.tags
        .map((tag) => tag.replace(/\s+/g, "-").toLowerCase())
        .join(" ")}`;
          propertyItem.id = `property-${property.id}`;

          propertyItem.innerHTML = `
        <div class="item">
        <a href="${property.link}"><img src="${property.img}" alt=""></a>
        <span class="category">${property.category}</span>
        <h6>${property.price}</h6>
        <h4><a href="${property.link}">${property.address}</a></h4>
        <div class="main-button" style="text-align: right;">
        <a href="${property.link}">View</a>
        </div>
        </div>
        `;

          propertiesContainer.appendChild(propertyItem);
        });
      }

      renderProperties();
    </script>
