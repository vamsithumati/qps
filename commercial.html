      function loadProjects(tab) {
        const container = document.getElementById("projects-container");
        container.innerHTML = "";
        projectData[tab].forEach((project, index) => {
          const card = `
          <div class="col-lg-6 mb-4">
            <div class="card" style="background-color: #f9f9f9; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); cursor: pointer;" onclick="loadDetailedContent('${tab}', ${index})">
              <div class="card-body">
                <h5 style="border-bottom: 2px solid #f35525; padding-bottom: 10px;">${project.title}</h5>
                <p><strong>Client:</strong> ${project.client}</p>
                <p><strong>Cost:</strong> ${project.cost}</p>
                <p><strong>Completion Date:</strong> ${project.completionDate}</p>
              </div>
              <img src="${project.image}" class="card-img-bottom" alt="${project.title}" style="border-radius: 0 0 8px 8px; padding: 10px;">
            </div>
          </div>
        `;
          container.innerHTML += card;
        });
      }

      function loadDetailedContent(tab, index) {
        const project = projectData[tab][index];
        const detailedContent = document.getElementById("detailed-content");
        detailedContent.innerHTML = `
        <h1>${project.title}</h1>
        <p><strong>Client:</strong> ${project.client}</p>
        <p><strong>Cost:</strong> ${project.cost}</p>
        <p><strong>Completion Date:</strong> ${project.completionDate}</p>
        <p>${project.description}</p>
        <div class="row">
          ${project.images
            .map(
              (img) => `
              <div class="col-lg-6 mb-4">
                <img src="${img}" alt="${project.title}" style="width: 100%; height: auto; border-radius: 8px;">
              </div>
            `
            )
            .join("")}
        </div>
      `;
        document.querySelector(".default-section").style.display = "none";
        document.querySelector(".detailed-section").style.display = "block";
        window.scrollTo({ top: 350, behavior: "smooth" });
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadProjects("completed");

        document
          .getElementById("projectTabs")
          .addEventListener("click", (e) => {
            if (e.target && e.target.matches("button")) {
              const tab =
                e.target.id === "completed-tab" ? "completed" : "ongoing";

              // Update button styles
              document
                .querySelectorAll("#projectTabs button")
                .forEach((button) => {
                  button.style.backgroundColor = "gray";
                  button.style.color = "white";
                });
              e.target.style.backgroundColor = "#f35525";
              e.target.style.color = "white";

              // Load projects
              loadProjects(tab);
            }
          });

        document
          .getElementById("default-back-button")
          .addEventListener("click", () => {
            document.querySelector(".default-section").style.display = "block";
            document.querySelector(".detailed-section").style.display = "none";
          });
